{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block page_content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <h2 class="mb-4">{{ title }}</h2>
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Grup Adı</label>
                            <input type="text" name="ad" class="form-control" value="{{ grup.ad|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Açıklama</label>
                            <textarea name="aciklama" class="form-control" rows="2">{{ grup.aciklama|default:'' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">İndirim Oranı (%)</label>
                            <input type="number" step="0.01" name="indirim_orani" class="form-control" value="{{ grup.indirim_orani|default:'0' }}">
                        </div>
                        <button type="submit" class="btn btn-primary">Kaydet</button>
                        <a href="{% url 'musteri:musteri_grup_listesi' %}" class="btn btn-outline-secondary">İptal</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
