{% extends 'base.html' %}

{% block title %}Müşteri Grupları{% endblock %}

{% block page_content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between mb-4">
        <h2>Müşteri Grupları</h2>
        <a href="{% url 'musteri:musteri_grup_ekle' %}" class="btn btn-primary btn-sm">Yeni Grup</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead><tr><th>Ad</th><th>İndirim %</th><th></th></tr></thead>
                <tbody>
                {% for grup in gruplar %}
                <tr>
                    <td>{{ grup.ad }}</td>
                    <td>{{ grup.indirim_orani }}</td>
                    <td><a href="{% url 'musteri:musteri_grup_duzenle' grup.pk %}" class="btn btn-sm btn-outline-primary">Düzenle</a></td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="text-muted">Grup yok.</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
