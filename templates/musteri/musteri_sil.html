{% extends 'base.html' %}

{% block title %}Müşteri Sil — {{ musteri.tam_ad }}{% endblock %}

{% block page_content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-warning">
                <div class="card-header bg-warning">Müşteri Sil</div>
                <div class="card-body">
                    <p><strong>{{ musteri.tam_ad }}</strong> kaydını pasifleştirmek istediğinize emin misiniz?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-warning">Pasifleştir</button>
                        <a href="{% url 'musteri:detay' musteri.pk %}" class="btn btn-outline-secondary">Vazgeç</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
